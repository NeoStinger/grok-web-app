<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Grok" />
  <meta name="description" content="Talk to Grok from any phone or desktop. Install this unofficial xAI chat app to your home screen." />
  <title>Grok Web</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <style>
    :root {
      --bg: #0a0a0b;
      --bg-2: #111113;
      --panel: #161618;
      --line: #2a2a2e;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --dim: #71717a;
      --accent: #ececef;
      --good: #4ade80;
      --bad: #fb7185;
      --shadow: 0 20px 60px rgba(0,0,0,.45);
      --safe-b: env(safe-area-inset-bottom);
      --safe-t: env(safe-area-inset-top);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "Helvetica Neue", ui-sans-serif, system-ui, sans-serif;
      letter-spacing: -0.011em;
      overflow: hidden;
    }
    button, [role="button"] { cursor: pointer; }
    button { font: inherit; color: inherit; background: none; border: 0; }
    textarea { font: inherit; color: inherit; }
    a { color: inherit; }
    .app { display: grid; grid-template-columns: 280px 1fr; height: 100dvh; }
    .sidebar { background: var(--bg-2); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: calc(14px + var(--safe-t)) 12px 16px; min-width: 0; }
    .brand { display: flex; align-items: center; gap: 10px; padding: 6px 8px 16px; }
    .logo { width: 28px; height: 28px; border-radius: 8px; background: #1c1c1f; display: grid; place-items: center; }
    .brand h1 { margin: 0; font-size: 16px; font-weight: 650; }
    .brand small { display: block; color: var(--dim); font-size: 11px; font-weight: 500; }
    .new-chat { display: flex; align-items: center; gap: 8px; width: 100%; border: 1px solid var(--line); background: #1a1a1d; border-radius: 12px; padding: 10px 12px; font-weight: 600; font-size: 14px; }
    .new-chat:hover { background: #202024; }
    .chat-list { flex: 1; overflow: auto; margin-top: 14px; display: flex; flex-direction: column; gap: 4px; }
    .chat-item { display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-radius: 10px; color: var(--muted); text-align: left; width: 100%; }
    .chat-item:hover { background: #1c1c20; color: var(--text); }
    .chat-item.active { background: #232328; color: var(--text); }
    .chat-item span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13.5px; }
    .chat-item .del { opacity: 0; color: var(--dim); padding: 2px; }
    .chat-item:hover .del, .chat-item.active .del { opacity: 1; }
    .side-foot { display: flex; flex-direction: column; gap: 6px; padding-top: 10px; border-top: 1px solid var(--line); }
    .ghost { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10px; color: var(--muted); font-size: 13.5px; }
    .ghost:hover { background: #1c1c20; color: var(--text); }
    .dot { width: 8px; height: 8px; border-radius: 99px; background: var(--dim); }
    .dot.on { background: var(--good); box-shadow: 0 0 0 3px rgba(74,222,128,.12); }
    .main { display: flex; flex-direction: column; min-width: 0; position: relative; }
    .topbar { display: none; align-items: center; gap: 8px; padding: calc(10px + var(--safe-t)) 12px 10px; border-bottom: 1px solid var(--line); }
    .icon-btn { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; color: var(--muted); }
    .icon-btn:hover { background: #1c1c20; color: var(--text); }
    .stage { flex: 1; overflow: auto; padding: 24px 16px 8px; }
    .thread { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; padding-bottom: 12px; }
    .hero { min-height: min(62vh, 560px); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 18px; padding: 24px 8px; }
    .hero-mark { width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(180deg, #1d1d22, #141416); border: 1px solid var(--line); display: grid; place-items: center; box-shadow: var(--shadow); }
    .hero h2 { margin: 0; font-size: clamp(28px, 5vw, 42px); font-weight: 620; letter-spacing: -0.04em; }
    .hero p { margin: 0; color: var(--muted); max-width: 420px; line-height: 1.5; }
    .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 640px; }
    .chip { border: 1px solid var(--line); background: #141416; color: var(--muted); border-radius: 999px; padding: 9px 13px; font-size: 13px; }
    .chip:hover { color: var(--text); background: #1b1b1f; }
    .msg { display: flex; gap: 12px; align-items: flex-start; }
    .avatar { width: 30px; height: 30px; border-radius: 9px; background: #1c1c20; border: 1px solid var(--line); display: grid; place-items: center; flex: none; margin-top: 2px; }
    .avatar.user { background: #f4f4f5; color: #111; }
    .bubble { min-width: 0; flex: 1; }
    .who { font-size: 12px; color: var(--dim); margin-bottom: 6px; font-weight: 600; }
    .content { line-height: 1.65; font-size: 15.5px; white-space: pre-wrap; word-break: break-word; }
    .content p { margin: 0 0 10px; }
    .content p:last-child { margin-bottom: 0; }
    .content code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .9em; background: #1c1c20; border: 1px solid var(--line); border-radius: 6px; padding: 1px 5px; }
    .content pre { background: #101012; border: 1px solid var(--line); border-radius: 12px; padding: 12px; overflow: auto; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .content pre code { border: 0; background: none; padding: 0; }
    .err { color: var(--bad); font-size: 14px; background: rgba(251,113,133,.08); border: 1px solid rgba(251,113,133,.25); border-radius: 12px; padding: 10px 12px; }
    .cursor::after { content: ""; display: inline-block; width: 7px; height: 1.05em; background: var(--text); margin-left: 2px; vertical-align: text-bottom; animation: blink .9s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .composer-wrap { padding: 8px 16px calc(16px + var(--safe-b)); }
    .composer { max-width: 760px; margin: 0 auto; background: #141416; border: 1px solid var(--line); border-radius: 22px; padding: 8px 8px 8px 16px; box-shadow: var(--shadow); }
    .composer textarea { width: 100%; border: 0; outline: none; background: transparent; resize: none; min-height: 44px; max-height: 180px; padding: 10px 4px 6px; line-height: 1.45; }
    .composer-row { display: flex; align-items: center; gap: 8px; padding-bottom: 4px; }
    .model { background: #1c1c20; border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 6px 10px; font-size: 12px; }
    .send { margin-left: auto; width: 38px; height: 38px; border-radius: 999px; background: var(--accent); color: #111; display: grid; place-items: center; }
    .hint { text-align: center; color: var(--dim); font-size: 11px; margin-top: 8px; }
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; z-index: 20; }
    .overlay.show { display: block; }
    .drawer, .modal { position: fixed; z-index: 30; background: var(--panel); border: 1px solid var(--line); }
    .drawer { top: 0; bottom: 0; left: 0; width: min(86vw, 300px); transform: translateX(-105%); transition: transform .22s ease; display: flex; flex-direction: column; padding: calc(14px + var(--safe-t)) 12px 16px; }
    .drawer.open { transform: none; }
    .modal { left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(92vw, 440px); border-radius: 20px; padding: 22px; display: none; box-shadow: var(--shadow); }
    .modal.show { display: block; }
    .modal h3 { margin: 0 0 8px; font-size: 20px; }
    .modal p { color: var(--muted); line-height: 1.5; margin: 0 0 14px; font-size: 14px; }
    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
    .field label { font-size: 12px; color: var(--dim); font-weight: 600; }
    .field input, .field select { background: #101012; border: 1px solid var(--line); color: var(--text); border-radius: 12px; padding: 11px 12px; font: inherit; }
    .primary { width: 100%; background: var(--accent); color: #111; border-radius: 12px; padding: 11px; font-weight: 700; }
    .install-banner { display: none; margin: 8px 12px 0; padding: 10px 12px; border: 1px dashed var(--line); border-radius: 12px; color: var(--muted); font-size: 12.5px; align-items: center; gap: 8px; }
    .install-banner.show { display: flex; }
    .install-banner button { margin-left: auto; background: var(--accent); color: #111; border-radius: 8px; padding: 6px 10px; font-size: 12px; font-weight: 700; }
    @media (max-width: 860px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .topbar { display: flex; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="desktop-sidebar"></aside>
    <section class="main">
      <header class="topbar">
        <button class="icon-btn" id="menu-btn" aria-label="Open menu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <strong>Grok Web</strong>
        <button class="icon-btn" id="new-mobile" aria-label="New chat" style="margin-left:auto">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </header>
      <div class="stage" id="stage"></div>
      <div class="composer-wrap">
        <form class="composer" id="form">
          <textarea id="input" rows="1" placeholder="Ask Grok anything…" autocomplete="off"></textarea>
          <div class="composer-row">
            <select class="model" id="model"></select>
            <button class="send" id="send" type="submit" aria-label="Send">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M3 11.5 21 3l-7.8 19-2.3-7.4L3 11.5z"/></svg>
            </button>
          </div>
        </form>
        <div class="hint">Unofficial Grok client · your xAI key stays in this browser · not affiliated with xAI</div>
      </div>
    </section>
  </div>
  <div class="overlay" id="overlay"></div>
  <aside class="drawer" id="drawer"></aside>
  <div class="modal" id="settings">
    <h3>Connect Grok</h3>
    <p>Paste an xAI API key from <a href="https://console.x.ai" target="_blank" rel="noreferrer">console.x.ai</a>. It is saved only on this device and sent straight to xAI when you chat.</p>
    <div class="field">
      <label for="api-key">xAI API key</label>
      <input id="api-key" type="password" placeholder="xai-…" autocomplete="off" />
    </div>
    <div class="field">
      <label for="default-model">Default model</label>
      <select id="default-model"></select>
    </div>
    <button class="primary" id="save-settings">Save and start chatting</button>
  </div>
  <script src="app.js"></script>
</body>
</html>
